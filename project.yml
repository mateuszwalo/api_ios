name: LocalLLMServer
options:
  bundleIdPrefix: com.localllm
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone and iPad; the target is an iPad
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:

  # Objective-C++ shim over llama.cpp: the C API, mtmd for vision, and
  # json_schema_to_grammar from common/. A separate target so the grammar tests can link it
  # without dragging in the app.
  LlamaBridge:
    type: framework
    platform: iOS
    sources:
      - path: Sources/LlamaBridge
        headerVisibility: public
    dependencies:
      - framework: build/LlamaCpp.xcframework
        embed: false
        link: true
      - sdk: Metal.framework
      - sdk: Accelerate.framework
    # An embedded framework needs its own Info.plist or the app will not install: the
    # loader validates every bundle inside Frameworks/ and refuses the lot when one has no
    # plist. Everything compiled and linked without it; the failure only appeared at
    # install time.
    info:
      path: Sources/LlamaBridge/Info.plist
      properties:
        CFBundleName: LlamaBridge
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    settings:
      base:
        DEFINES_MODULE: YES
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        GCC_C_LANGUAGE_STANDARD: c11
        # build/Headers holds the staged llama.cpp headers; the second entry lets the
        # implementation find its own umbrella header, which lives in a subdirectory.
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/build/Headers"
          - "$(SRCROOT)/Sources/LlamaBridge/include"
        # The bridge throws std::exception across its own frames when a schema cannot be
        # converted; without this the conversion failure becomes a crash.
        GCC_ENABLE_CPP_EXCEPTIONS: YES

  LocalLLMServer:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      # Fixture schemas ship with the app so GET /v1/selftest can check the converter on the
      # device. Real schemas are never committed; they go into Documents/selftest/ over Files.
      - path: Tests/Fixtures
        buildPhase: resources
        excludes: ["README.md"]
    dependencies:
      - target: LlamaBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localllm.server
        CODE_SIGN_ENTITLEMENTS: Sources/App/LocalLLMServer.entitlements
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: LocalLLM Server
        UIFileSharingEnabled: true                    # drop a .gguf in over Files
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "LocalLLM Server exposes an OpenAI-compatible HTTP endpoint on your local network so other devices can send inference requests to this iPad."
        NSBonjourServices: ["_http._tcp"]             # also what prompts for local network permission
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false

  LocalLLMServerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/GrammarTests
      - Tests/ServerTests
      - path: Tests/Fixtures
        buildPhase: resources
        excludes: ["README.md"]
    dependencies:
      - target: LocalLLMServer
      - target: LlamaBridge
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LocalLLMServer.app/LocalLLMServer"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LocalLLMServer:
    build:
      targets: { LocalLLMServer: all, LocalLLMServerTests: [test] }
    test:
      targets: [LocalLLMServerTests]
      gatherCoverageData: false
