name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # A minute, and it answers the one question that cannot be answered anywhere else:
  # whether this account has macOS runners at all.
  probe:
    runs-on: macos-15
    steps:
      - run: sw_vers
      - run: xcodebuild -version
      - run: xcrun --sdk iphoneos --show-sdk-version
      - run: cmake --version || brew install cmake
      - run: xcodegen --version || brew install xcodegen

  build:
    needs: probe
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install xcodegen cmake

      - name: Cache LlamaCpp.xcframework
        id: xcf-cache
        uses: actions/cache@v4
        with:
          path: |
            build/LlamaCpp.xcframework
            build/Headers
          # Keyed on the pinned tag and the script that builds it. The cache matters: a full
          # build is around half an hour, a cached one a few minutes.
          key: xcf-${{ runner.os }}-${{ hashFiles('LLAMA_CPP_TAG', 'scripts/build-llama-xcframework.sh') }}

      - name: Build llama.cpp XCFramework
        if: steps.xcf-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          scripts/build-llama-xcframework.sh 2>&1 | tee xcframework.log

      - name: Generate Xcode project
        run: xcodegen generate

      # Simulator names drift between Xcode releases, so one is picked from what this runner
      # actually has rather than named here and broken by the next image update.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
                devices=[x for k,v in d.items() if 'iOS' in k for x in v if x.get('isAvailable')]; \
                ipads=[x for x in devices if 'iPad' in x['name']]; \
                print((ipads or devices)[0]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Unit tests (simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme LocalLLMServer \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd-test \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee tests.log

      - name: Build unsigned (device)
        run: |
          set -o pipefail
          xcodebuild -scheme LocalLLMServer -configuration Release -sdk iphoneos \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO 2>&1 | tee device.log

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir -p Payload
          cp -R build/dd/Build/Products/Release-iphoneos/LocalLLMServer.app Payload/
          zip -qry LocalLLMServer.ipa Payload
          ls -lh LocalLLMServer.ipa
          echo "llama.cpp: $(cat build/LlamaCpp.xcframework/BUILD_INFO 2>/dev/null || echo cached)"

      - uses: actions/upload-artifact@v4
        with:
          name: LocalLLMServer-ipa
          path: LocalLLMServer.ipa
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LocalLLMServer.ipa
          body: |
            Niepodpisana IPA do sideloadu (AltStore / Sideloadly, darmowe Apple ID).
            Podpis darmowym Apple ID wygasa po 7 dniach.

      # Job logs need repository admin rights to fetch over the API, but the step summary is
      # part of the public check run. Putting the failure here is what lets whoever is fixing
      # the build read it without an account, which is the difference between an iteration
      # that takes minutes and one that takes a round trip through another person.
      - name: Failure report
        if: failure()
        run: |
          {
            echo "## Build failed"
            for log in xcframework tests device; do
              if [ -f "$log.log" ]; then
                echo "### $log.log (errors)"
                echo '```'
                grep -nE "error:|FAILED|fatal error|\*\* BUILD FAILED|No such file|not found|Undefined symbol" "$log.log" | head -n 60 || true
                echo '```'
                echo "### $log.log (tail)"
                echo '```'
                tail -n 80 "$log.log"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
