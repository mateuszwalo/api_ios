name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Sonda: 1-2 minuty, potwierdza ze runner macOS jest w ogole dostepny
  # i jakie ma Xcode/CMake. Uruchamiac PIERWSZE na nowym repo.
  probe:
    runs-on: macos-15
    steps:
      - run: sw_vers
      - run: xcodebuild -version
      - run: xcrun --sdk iphoneos --show-sdk-version
      - run: cmake --version || brew install cmake
      - run: xcodegen --version || brew install xcodegen

  build:
    needs: probe
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install xcodegen cmake

      - name: Cache LlamaCpp.xcframework
        id: xcf-cache
        uses: actions/cache@v4
        with:
          path: |
            build/LlamaCpp.xcframework
            build/Headers
          # Klucz = przypiety tag + skrypt budujacy. Cache jest tu istotny kosztowo:
          # pelny build to ~30 min, z cache'em caly job schodzi do kilku minut.
          key: xcf-${{ runner.os }}-${{ hashFiles('LLAMA_CPP_TAG', 'scripts/build-llama-xcframework.sh') }}

      - name: Build llama.cpp XCFramework
        if: steps.xcf-cache.outputs.cache-hit != 'true'
        run: scripts/build-llama-xcframework.sh

      - name: Generate Xcode project
        run: xcodegen generate

      # Simulator names drift between Xcode releases, so one is picked from what this runner
      # actually has rather than named here and broken by the next image update.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
                devices=[x for k,v in d.items() if 'iOS' in k for x in v if x.get('isAvailable')]; \
                ipads=[x for x in devices if 'iPad' in x['name']]; \
                print((ipads or devices)[0]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID" || true

      - name: Unit tests (simulator)
        run: |
          xcodebuild test \
            -scheme LocalLLMServer \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd-test \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned (device)
        run: |
          xcodebuild -scheme LocalLLMServer -configuration Release -sdk iphoneos \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir -p Payload
          cp -R build/dd/Build/Products/Release-iphoneos/LocalLLMServer.app Payload/
          zip -qry LocalLLMServer.ipa Payload
          ls -lh LocalLLMServer.ipa
          echo "llama.cpp: $(cat build/LlamaCpp.xcframework/BUILD_INFO 2>/dev/null || echo cached)"

      - uses: actions/upload-artifact@v4
        with:
          name: LocalLLMServer-ipa
          path: LocalLLMServer.ipa
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LocalLLMServer.ipa
          body: |
            Niepodpisana IPA do sideloadu (AltStore / Sideloadly, darmowe Apple ID).
            Podpis darmowym Apple ID wygasa po 7 dniach.
